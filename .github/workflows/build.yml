# Builds the macOS and Windows apps on GitHub's machines and attaches them to
# the run. The core tests need the Data folder, which is not in the repository,
# so here they are skipped and only the build and the imports are checked.
name: build
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv && .venv/bin/pip install -r requirements.txt
          bash packaging/build_mac.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          py -3.12 -m venv .venv && .venv\Scripts\pip install -r requirements.txt && packaging\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: FASTER-Fusion-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-Setup.exe
