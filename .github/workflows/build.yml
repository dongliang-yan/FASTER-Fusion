# Builds the macOS and Windows apps on GitHub's machines and attaches them to
# the run. The core tests need the Data folder, which is not in the repository,
# so here they are skipped and only the build and the imports are checked.
#
# To publish a download page (Releases) for a version, push a tag:
#   git tag v1.2.2 && git push origin v1.2.2
# The release gets the macOS .dmg, the Windows installer and the Windows .zip.
name: build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m venv .venv && .venv/bin/pip install -r requirements.txt
          bash packaging/build_mac.sh
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          py -3.12 -m venv .venv && .venv\Scripts\pip install -r requirements.txt && packaging\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: FASTER-Fusion-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*-Setup.exe
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          body: |
            ## Download
            - **Windows:** `FASTER-Fusion-*-Setup.exe` (installer with Start Menu and Desktop shortcuts), or the portable `-Windows.zip`
            - **macOS (Apple silicon):** `FASTER-Fusion-*-macOS.dmg`, drag to Applications, then right-click → Open the first time (the app is not code-signed)
